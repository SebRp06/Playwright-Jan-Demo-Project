# Documentación asociada: src/docs/07_CICD_Pipeline.md
name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Instalar dependencias
      run: npm ci

    - name: Instalar navegadores de Playwright
      run: npx playwright install --with-deps

    - name: Ejecutar pruebas de Playwright
      run: npx playwright test
      env:
        # Las variables se inyectan desde los "Secrets" de GitHub
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_USER: ${{ secrets.TEST_USER }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    - name: Subir reporte HTML como artefacto
      uses: actions/upload-artifact@v4
      if: always() # Asegura que el reporte suba incluso si las pruebas fallan
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15